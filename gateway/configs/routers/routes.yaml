server:
  port: 8080
  gateway_host: 0.0.0.0
  microservices_host: 192.168.0.15

microservices_timeouts:
  auth: 40s
  backend: 20s
  verify: 20s
  todo: 20s
  messenger: 20s

microservices_hosts:
  auth:
    host: http://Cadence-Cloud-auth-service:6637
    timeout: ${microservices_timeouts.auth}
  backend:
    host: http://Cadence-Cloud-users-backend:8989
    timeout: ${microservices_timeouts.backend}
  verify:
    host: http://Cadence-Cloud-verify-service:8991
    timeout: ${microservices_timeouts.verify}
  todo:
    host: http://Cadence-Cloud-todo-service:8992
    timeout: ${microservices_timeouts.todo}
  messenger:
    host: http://Cadence-Cloud-messenger-service:8993
    timeout: ${microservices_timeouts.messenger}

public_routes:
  - path: /main/api/v1/
    method: GET
    target: local
    handler: hello

  - path: /main/api/v1/docs
    method: GET
    target: local
    handler: docs

  - path: /main/api/v1/openapi/openapi.yml
    method: GET
    target: local
    handler: openapi

  - path: /main/api/v1/start/log/in/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/log/in/my/account

  - path: /main/api/v1/start/create/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/create/my/account

  - path: /main/api/v1/start/refresh/my/token
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/refresh/my/token

  - path: /main/api/v1/start/log/out/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/log/out/my/account

private_routes: 
  - path: /main/api/v1/get/my/profile/info
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/profile/info

  - path: /main/api/v1/edit/my/name
    method: PATCH
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/edit/my/name

  - path: /main/api/v1/edit/my/email
    method: PATCH
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/edit/my/email

  - path: /main/api/v1/start/upload/my/avatar
    method: POST
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/start/upload/my/avatar

  - path: /main/api/v1/delete/my/avatar
    method: DELETE
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/delete/my/avatar

  - path: /main/api/v1/start/upload/images
    method: POST
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/start/upload/images

  - path: /main/api/v1/get/my/images
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/images

  - path: /main/api/v1/get/my/image/:key
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/image/:key

  - path: /main/api/v1/delete/my/image/:key
    method: DELETE
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/delete/my/image/:key

  - path: /main/api/v1/todo/create/my/board
    method: POST
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/create/my/board

  - path: /main/api/v1/todo/get/my/boards
    method: GET
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/get/my/boards

  - path: /main/api/v1/todo/get/my/board/:id
    method: GET
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/get/my/board/:id

  - path: /main/api/v1/todo/edit/my/board/:id
    method: PATCH
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/edit/my/board/:id

  - path: /main/api/v1/todo/delete/my/board/:id
    method: DELETE
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/delete/my/board/:id

  - path: /main/api/v1/todo/import/my/board
    method: POST
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/import/my/board

  - path: /main/api/v1/todo/export/my/board/:id
    method: GET
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/export/my/board/:id

  - path: /main/api/v1/todo/create/my/board/:id/node
    method: POST
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/create/my/board/:id/node

  - path: /main/api/v1/todo/edit/my/node/:id
    method: PATCH
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/edit/my/node/:id

  - path: /main/api/v1/todo/reorder/my/board/:id
    method: PUT
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/reorder/my/board/:id

  - path: /main/api/v1/todo/delete/my/node/:id
    method: DELETE
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/delete/my/node/:id

  - path: /main/api/v1/todo/create/my/node/:id/task
    method: POST
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/create/my/node/:id/task

  - path: /main/api/v1/todo/edit/my/task/:id
    method: PATCH
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/edit/my/task/:id

  - path: /main/api/v1/todo/move/my/task/:id
    method: PATCH
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/move/my/task/:id

  - path: /main/api/v1/todo/delete/my/task/:id
    method: DELETE
    target: ${microservices_hosts.todo}
    timeout: ${microservices_hosts.todo.timeout}
    prefix: /api/v1/main/todo/delete/my/task/:id

  - path: /main/api/v1/messenger/put/my/key
    method: PUT
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/put/my/key

  - path: /main/api/v1/messenger/get/my/key
    method: GET
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/get/my/key

  - path: /main/api/v1/messenger/put/my/key/backup
    method: PUT
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/put/my/key/backup

  - path: /main/api/v1/messenger/get/user/key/:uuid
    method: GET
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/get/user/key/:uuid

  - path: /main/api/v1/messenger/search/users
    method: GET
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/search/users

  - path: /main/api/v1/messenger/send/message
    method: POST
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/send/message

  - path: /main/api/v1/messenger/get/my/messages
    method: GET
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/get/my/messages

  - path: /main/api/v1/messenger/get/my/conversations
    method: GET
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/get/my/conversations

  - path: /main/api/v1/messenger/mark/my/messages/read
    method: PATCH
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/mark/my/messages/read

  - path: /main/api/v1/messenger/delete/my/message/:id
    method: DELETE
    target: ${microservices_hosts.messenger}
    timeout: ${microservices_hosts.messenger.timeout}
    prefix: /api/v1/main/messenger/delete/my/message/:id

  - path: /main/api/v1/verify/status
    method: GET
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/status

  - path: /main/api/v1/verify/resend
    method: POST
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/resend

  - path: /main/api/v1/verify/confirm
    method: POST
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/confirm

rate_limits: ./limits/rate-limits.yaml