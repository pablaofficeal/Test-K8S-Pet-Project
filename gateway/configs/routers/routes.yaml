server:
  port: 8080
  gateway_host: 0.0.0.0
  microservices_host: 192.168.0.15

microservices_timeouts:
  auth: 40s
  backend: 20s
  verify: 20s

microservices_hosts:
  auth:
    host: http://Cadence-Cloud-auth-service:6637
    timeout: ${microservices_timeouts.auth}
  backend:
    host: http://Cadence-Cloud-users-backend:8989
    timeout: ${microservices_timeouts.backend}
  verify:
    host: http://Cadence-Cloud-verify-service:8991
    timeout: ${microservices_timeouts.verify}

public_routes:
  - path: /main/api/v1/
    method: GET
    target: local
    handler: hello

  - path: /main/api/v1/docs
    method: GET
    target: local
    handler: docs

  - path: /main/api/v1/openapi/openapi.yml
    method: GET
    target: local
    handler: openapi

  - path: /main/api/v1/start/log/in/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/log/in/my/account

  - path: /main/api/v1/start/create/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/create/my/account

  - path: /main/api/v1/start/refresh/my/token
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/refresh/my/token

  - path: /main/api/v1/start/log/out/my/account
    method: POST
    target: ${microservices_hosts.auth}
    timeout: ${microservices_hosts.auth.timeout}
    prefix: /main/api/v1/start/log/out/my/account

private_routes: 
  - path: /main/api/v1/get/my/profile/info
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/profile/info

  - path: /main/api/v1/edit/my/name
    method: PATCH
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/edit/my/name

  - path: /main/api/v1/edit/my/email
    method: PATCH
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/edit/my/email

  - path: /main/api/v1/start/upload/my/avatar
    method: POST
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/start/upload/my/avatar

  - path: /main/api/v1/delete/my/avatar
    method: DELETE
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/delete/my/avatar

  - path: /main/api/v1/start/upload/images
    method: POST
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/start/upload/images

  - path: /main/api/v1/get/my/images
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/images

  - path: /main/api/v1/get/my/image/:key
    method: GET
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/get/my/image/:key

  - path: /main/api/v1/delete/my/image/:key
    method: DELETE
    target: ${microservices_hosts.backend}
    timeout: ${microservices_hosts.backend.timeout}
    prefix: /api/v1/main/backend/delete/my/image/:key

  - path: /main/api/v1/verify/status
    method: GET
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/status

  - path: /main/api/v1/verify/resend
    method: POST
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/resend

  - path: /main/api/v1/verify/confirm
    method: POST
    target: ${microservices_hosts.verify}
    timeout: ${microservices_hosts.verify.timeout}
    prefix: /api/v1/main/verify/confirm

rate_limits: ./limits/rate-limits.yaml