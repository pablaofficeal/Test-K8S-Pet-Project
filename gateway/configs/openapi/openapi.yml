openapi: 3.0.3
info:
  title: Low-Code-Bot-Platform Api documentation
  version: 1.0.0
  description: OpenAPI documentation for the Low-Code-Bot-Platform Api.

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Verify

paths:
  /main/api/v1/:
    get:
      tags: [Health]
      summary: Health check
      description: Check if the service is running.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /main/api/v1/start/log/in/my/account:
    post:
      tags: [Auth]
      summary: User login
      description: Authenticate a user and return a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: test@test.test
                password:
                  type: string
                  example: 11072008
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    type: object
                    properties:
                      uuid:
                        type: string
                        example: a1b2c3d4-e5f6-7890-1234-567890abcdef
                      email:
                        type: string
                        example: test@test.test
                      first_name:
                        type: string
                        example: John
                      last_name:
                        type: string
                        example: Doe
                      role:
                        type: string
                        example: admin
                      created_at:
                        type: string
                        format: date-time
                        example: "2026-10-22T09:14:25Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid credentials

  /main/api/v1/start/create/my/account:
    post:
      tags: [Auth]
      summary: User registration
      description: Register a new user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: test
                email:
                  type: string
                  example: test@test.test
                password:
                  type: string
                  example: 11072008
              required:
                - username
                - email
                - password
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User created successfully
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Invalid data

  /main/api/v1/get/my/profile/info:
    get:
      tags: [Profile]
      summary: Get user profile
      description: Retrieve the profile information of the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    example: a1b2c3d4-e5f6-7890-1234-567890abcdef
                  email:
                    type: string
                    example: test@test.test
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
                  role:
                    type: string
                    example: admin
                  created_at:
                    type: string
                    format: date-time
                    example: "2026-10-22T09:14:25Z"

  /main/api/v1/start/upload/images:
    post:
      tags: [Images]
      summary: Upload an image
      description: Upload a jpeg, png, webp or gif image (up to 10 MB) to the authenticated user's storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    example: 3f2b8c1e-5a47-4d0e-9a52-0c6f5f2b7d11.png
                  content_type:
                    type: string
                    example: image/png
                  size:
                    type: integer
                    example: 68
        "400":
          description: File is missing
        "413":
          description: File is larger than 10 MB
        "415":
          description: Unsupported file type

  /main/api/v1/get/my/images:
    get:
      tags: [Images]
      summary: List my images
      description: Keys of all images uploaded by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: 3f2b8c1e-5a47-4d0e-9a52-0c6f5f2b7d11.png
                        size:
                          type: integer
                          example: 68
                        last_modified:
                          type: string
                          format: date-time

  /main/api/v1/get/my/image/{key}:
    get:
      tags: [Images]
      summary: Download an image
      description: Returns the image bytes. Only the owner can read an image.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Image not found

  /main/api/v1/delete/my/image/{key}:
    delete:
      tags: [Images]
      summary: Delete an image
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /main/api/v1/verify/status:
    get:
      tags: [Verify]
      summary: Email verification status
      description: Whether the email is verified, and how long until a new code can be requested or the current one expires.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: false
                  email:
                    type: string
                    example: test@test.test
                  resend_in:
                    type: integer
                    description: Seconds until a new code can be requested.
                    example: 42
                  expires_in:
                    type: integer
                    description: Seconds until the active code expires, 0 if there is none.
                    example: 540

  /main/api/v1/verify/resend:
    post:
      tags: [Verify]
      summary: Request a new verification code
      security:
        - bearerAuth: []
      responses:
        "202":
          description: A new code was issued.
        "409":
          description: Email is already verified.
        "429":
          description: Cooldown or hourly limit reached, see the Retry-After header.

  /main/api/v1/verify/confirm:
    post:
      tags: [Verify]
      summary: Confirm the email with a 6 digit code
      description: Spaces and dashes in the code are ignored. The number of attempts per code is limited.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "893658"
      responses:
        "200":
          description: Email verified.
        "400":
          description: Invalid code format, wrong code (attempts_left is returned) or no active code.
        "429":
          description: Too many attempts, request a new code.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session JWT.