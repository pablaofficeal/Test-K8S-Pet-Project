listen_addresses = '*'
port = 5432
max_connections = 150
shared_buffers = 1024MB

ssl = off
ssl_ca_file = ''
ssl_cert_file = ''
ssl_key_file = ''

#ssl = on
#ssl_ca_file = '/etc/postgresql/certs/myCA.crt'
#ssl_cert_file = '/etc/postgresql/certs/server.crt'
#ssl_key_file = '/etc/postgresql/certs/server.key'

#ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'

log_statement = 'all'
timezone = 'UTC'

checkpoint_completion_target = 0.9
work_mem = 16MB
effective_cache_size = 1536MB
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB