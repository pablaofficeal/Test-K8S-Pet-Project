# Apply once after Argo CD is installed:  kubectl apply -f argocd/application.yaml
# Secrets are NOT in git, create them first: k8s/secrets/create-secrets.sh --env-file .env.prod
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cadence-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pablaofficeal/Test-K8S-Pet-Project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cadence-cloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
