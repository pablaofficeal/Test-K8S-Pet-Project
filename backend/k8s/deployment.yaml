
apiVersion: apps/v1
kind: Deployment

metadata:
  name: test-k8s-api
  labels:
    app: test-k8s-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: test-k8s-api

  template:
    metadata:
      labels:
        app: test-k8s-api

    spec:
      containers:
        - name: test-k8s-api
          image: test-k8s-api:0.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
