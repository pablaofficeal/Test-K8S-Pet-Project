name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'todo/**'
      - 'messenger/**'
      - 'auth/**'
      - 'gateway/**'
      - 'migrations/**'
      - 'verify/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'todo/**'
      - 'messenger/**'
      - 'auth/**'
      - 'gateway/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./test/... -v

  test-todo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: todo/go.mod
          cache-dependency-path: todo/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./test/... -v

  test-messenger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: messenger
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: messenger/go.mod
          cache-dependency-path: messenger/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./test/... -v

  test-auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    defaults:
      run:
        working-directory: auth
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            auth/requirements.txt
            auth/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: pytest -q

  test-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gateway/target
          key: cargo-${{ runner.os }}-${{ hashFiles('gateway/Cargo.lock') }}

      - name: Test
        run: cargo test --locked

  build-and-push:
    needs: [test-backend, test-todo, test-messenger, test-auth, test-gateway]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: backend
            image: cadence-cloud-backend
          - context: todo
            image: cadence-cloud-todo
          - context: messenger
            image: cadence-cloud-messenger
          - context: auth
            image: cadence-cloud-auth
          - context: gateway
            image: cadence-cloud-gateway
          - context: migrations
            image: cadence-cloud-migrations
          - context: verify
            image: cadence-cloud-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=${{ matrix.context }}

  bump-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Point k8s/kustomization.yaml at the new images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TAG="${GITHUB_SHA::7}"
          for image in cadence-cloud-messenger cadence-cloud-todo cadence-cloud-backend cadence-cloud-auth cadence-cloud-gateway cadence-cloud-migrations cadence-cloud-verify; do
            sed -i "/^  - name: $image\$/{n;s|newName: .*|newName: $DH_USER/$image|;n;s|newTag: .*|newTag: $TAG|}" k8s/kustomization.yaml
          done

      - name: Commit and push
        run: |
          if git diff --quiet; then echo "nothing to bump"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump images to ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
