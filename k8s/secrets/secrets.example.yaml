# TEMPLATE ONLY. Do not put real values here and do not apply this file as is.
# Create the real secrets with ./create-secrets.sh (see docs/k8s-secrets.md).
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: low-code-bot-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@low-code-bot-platform-postgresql:5432/DB   # resolved to the host DB via k8s/database/service.yaml
---
# Used by the migrations Job (same database as database-url)
apiVersion: v1
kind: Secret
metadata:
  name: migration-db-url
  namespace: low-code-bot-platform
type: Opaque
stringData:
  MIGRATION_DB_URL: postgresql://USER:PASSWORD@low-code-bot-platform-postgresql:5432/DB
---
# Used by the auth service ONLY
apiVersion: v1
kind: Secret
metadata:
  name: jwt-private-key
  namespace: low-code-bot-platform
type: Opaque
stringData:
  JWT_SECRET_KEY: "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----"
---
# Used by auth, backend and gateway
apiVersion: v1
kind: Secret
metadata:
  name: jwt-public-key
  namespace: low-code-bot-platform
type: Opaque
stringData:
  JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nCHANGE_ME\n-----END PUBLIC KEY-----"
