# TEMPLATE ONLY. Do not put real values here and do not apply this file as is.
# Create the real secrets with ./create-secrets.sh (see docs/k8s-secrets.md).
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: cadence-cloud
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@cadence-cloud-postgresql:5432/DB   # resolved to the host DB via k8s/database/service.yaml
---
# Used by the migrations Job (same database as database-url)
apiVersion: v1
kind: Secret
metadata:
  name: migration-db-url
  namespace: cadence-cloud
type: Opaque
stringData:
  MIGRATION_DB_URL: postgresql://USER:PASSWORD@cadence-cloud-postgresql:5432/DB
---
# Used by the auth service ONLY (publishes verification requests)
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-auth-url
  namespace: cadence-cloud
type: Opaque
stringData:
  RABBITMQ_AUTH_URL: amqp://auth:PASSWORD@cadence-cloud-rabbitmq:5672/cadence
---
# Used by the verify service ONLY (consumes verification requests)
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-verify-url
  namespace: cadence-cloud
type: Opaque
stringData:
  RABBITMQ_VERIFY_URL: amqp://verify:PASSWORD@cadence-cloud-rabbitmq:5672/cadence
---
# Used by the verify service ONLY (HMAC key for stored code hashes)
apiVersion: v1
kind: Secret
metadata:
  name: verify-pepper
  namespace: cadence-cloud
type: Opaque
stringData:
  VERIFY_CODE_PEPPER: CHANGE_ME_AT_LEAST_8_CHARACTERS
---
# Used by the auth service ONLY
apiVersion: v1
kind: Secret
metadata:
  name: jwt-private-key
  namespace: cadence-cloud
type: Opaque
stringData:
  JWT_SECRET_KEY: "-----BEGIN PRIVATE KEY-----\nCHANGE_ME\n-----END PRIVATE KEY-----"
---
# Used by auth, backend and gateway
apiVersion: v1
kind: Secret
metadata:
  name: jwt-public-key
  namespace: cadence-cloud
type: Opaque
stringData:
  JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\nCHANGE_ME\n-----END PUBLIC KEY-----"
---
# Used by the backend service ONLY (RustFS / S3 access keys)
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: cadence-cloud
type: Opaque
stringData:
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
