# Runs `migrations up` (AutoMigrate + seed) against the database on every Argo CD sync.
# Runs after the database Service/EndpointSlice (wave -2) and BEFORE the Deployments (wave 0):
# services such as verify wait for their tables, so they cannot become healthy until this Job has finished.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrations
    spec:
      restartPolicy: OnFailure
      serviceAccountName: migrations
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrations
          image: low-code-bot-platform-migrations:latest
          imagePullPolicy: IfNotPresent
          args: ["up"]
          env:
            - name: MIGRATION_DB_URL
              valueFrom:
                secretKeyRef:
                  name: migration-db-url
                  key: MIGRATION_DB_URL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
