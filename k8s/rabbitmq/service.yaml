# RabbitMQ runs outside the cluster (docker compose on the host, 192.168.0.15:56772).
# Same approach as k8s/database: a Service + EndpointSlice gives it a stable in-cluster name,
# so RABBITMQ_*_URL keeps the host `low-code-bot-platform-rabbitmq` and port 5672.
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: low-code-bot-platform-rabbitmq
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 56772
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: low-code-bot-platform-rabbitmq-external
  labels:
    kubernetes.io/service-name: low-code-bot-platform-rabbitmq
addressType: IPv4
ports:
  - name: amqp
    protocol: TCP
    port: 56772
endpoints:
  - addresses:
      - 192.168.0.15
