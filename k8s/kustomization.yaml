apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: low-code-bot-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - networkpolicies.yaml
  - database/service.yaml
  - auth/deployment.yaml
  - auth/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - migrations/job.yaml

# Set your registry/tags here (or with `kustomize edit set image`)
images:
  - name: low-code-bot-platform-auth
    newName: pablaofficeal/low-code-bot-platform-auth
    newTag: 24374f6
  - name: test-k8s-api
    newName: pablaofficeal/test-k8s-api
    newTag: 24374f6
  - name: low-code-bot-platform-migrations
    newName: pablaofficeal/low-code-bot-platform-migrations
    newTag: 24374f6
  - name: low-code-bot-platform-gateway
    newName: pablaofficeal/low-code-bot-platform-gateway
    newTag: 24374f6

labels:
  - pairs:
      app.kubernetes.io/part-of: low-code-bot-platform
