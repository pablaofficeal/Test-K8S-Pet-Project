apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cadence-cloud

resources:
  - namespace.yaml
  - configmap.yaml
  - serviceaccounts.yaml
  - networkpolicies.yaml
  - database/service.yaml
  - rabbitmq/service.yaml
  - s3/service.yaml
  - redis/service.yaml
  - auth/deployment.yaml
  - auth/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - gateway/ingress.yaml
  - migrations/job.yaml
  - verify/configmap.yaml
  - verify/deployment.yaml
  - verify/service.yaml
  - todo/deployment.yaml
  - todo/service.yaml
  - messenger/deployment.yaml
  - messenger/service.yaml

# Set your registry/tags here (or with `kustomize edit set image`)
images:
  - name: cadence-cloud-auth
    newName: pablaofficeal/cadence-cloud-auth
    newTag: 8b3726f
  - name: cadence-cloud-backend
    newName: pablaofficeal/cadence-cloud-backend
    newTag: 8b3726f
  - name: cadence-cloud-verify
    newName: pablaofficeal/cadence-cloud-verify
    newTag: 8b3726f
  - name: cadence-cloud-migrations
    newName: pablaofficeal/cadence-cloud-migrations
    newTag: 8b3726f
  - name: cadence-cloud-todo
    newName: pablaofficeal/cadence-cloud-todo
    newTag: 8b3726f
  - name: cadence-cloud-messenger
    newName: pablaofficeal/cadence-cloud-messenger
    newTag: 8b3726f
  - name: cadence-cloud-gateway
    newName: pablaofficeal/cadence-cloud-gateway
    newTag: 8b3726f

labels:
  - pairs:
      app.kubernetes.io/part-of: cadence-cloud
