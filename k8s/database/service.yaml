# PostgreSQL runs outside the cluster (docker compose on the host, 192.168.0.15:56799).
# This Service + EndpointSlice give it a stable in-cluster name, so DATABASE_URL can keep
# the host `cadence-cloud-postgresql` and port 5432.
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: cadence-cloud-postgresql
spec:
  ports:
    - name: pg
      port: 5432
      targetPort: 56799
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: cadence-cloud-postgresql-external
  labels:
    kubernetes.io/service-name: cadence-cloud-postgresql
addressType: IPv4
ports:
  - name: pg
    protocol: TCP
    port: 56799
endpoints:
  - addresses:
      - 192.168.0.15
