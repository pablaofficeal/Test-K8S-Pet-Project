# RustFS (S3) runs outside the cluster (docker compose on the host, 192.168.0.15:9002).
# Same approach as k8s/database: a Service + EndpointSlice gives it a stable in-cluster name,
# so S3_ENDPOINT is `low-code-bot-platform-s3:9000`.
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: low-code-bot-platform-s3
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9002
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: low-code-bot-platform-s3-external
  labels:
    kubernetes.io/service-name: low-code-bot-platform-s3
addressType: IPv4
ports:
  - name: s3
    protocol: TCP
    port: 9002
endpoints:
  - addresses:
      - 192.168.0.15
